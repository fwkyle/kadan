<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">카단 구조: 누가 누구와 무엇을 주고받나</title>
  <desc id="d">사용자, 비서와 디스코드, 슈퍼감독, 일반감독, 작업자와 검수자가 발령·보고·질문·결정·우편을 주고받고, 감시기가 경보를 보내며, 모든 사건은 원장에 덧붙고, 역할은 tmux 바닥에서 산다.</desc>
  <style>
    text { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; word-break: keep-all; fill: #0f172a; }
    .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .title { font-size: 20px; font-weight: 700; }
    .name { font-size: 17px; font-weight: 700; }
    .note { font-size: 12.5px; fill: #334155; }
    .lbl { font-size: 13px; font-weight: 600; fill: #0f172a; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.6; }
    .human { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .ai { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.6; }
    .watch { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .inner { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.2; }
    .ledger { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .floor { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 7 5; }
    .win { fill: #ede9fe; stroke: #6d28d9; stroke-width: 1.6; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.8; marker-end: url(#head); }
    .alert { fill: none; stroke: #b91c1c; stroke-width: 1.8; marker-end: url(#headRed); }
    .rec { fill: none; stroke: #15803d; stroke-width: 1.6; stroke-dasharray: 5 4; marker-end: url(#headGreen); }
    .read { fill: none; stroke: #b91c1c; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#headRed); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="headRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
    <marker id="headGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
  </defs>

  <rect class="bg" x="1" y="1" width="1198" height="718" rx="14"/>
  <text class="title" x="30" y="38">카단 구조 — 누가 누구와 무엇을 주고받나</text>

  <!-- 사용자 -->
  <rect class="human" x="300" y="64" width="400" height="56" rx="10"/>
  <text class="name" x="500" y="88" text-anchor="middle">사용자</text>
  <text class="note" x="500" y="108" text-anchor="middle">승인과 결정은 사람만 한다</text>

  <!-- 비서 · 디스코드 -->
  <rect class="ai" x="30" y="150" width="205" height="76" rx="10"/>
  <text class="name" x="132" y="176" text-anchor="middle">비서 · 디스코드</text>
  <text class="note" x="132" y="196" text-anchor="middle">사용자 요청을 전하고</text>
  <text class="note" x="132" y="213" text-anchor="middle">확인 결과를 돌려준다</text>

  <!-- 슈퍼감독 -->
  <rect class="ai" x="300" y="190" width="400" height="56" rx="10"/>
  <text class="name" x="500" y="214" text-anchor="middle">슈퍼감독</text>
  <text class="note" x="500" y="234" text-anchor="middle">판 사이 조정 · 사용자에게 결정 요청</text>

  <!-- 일반감독 -->
  <rect class="ai" x="300" y="330" width="400" height="56" rx="10"/>
  <text class="name" x="500" y="354" text-anchor="middle">일반감독</text>
  <text class="note" x="500" y="374" text-anchor="middle">카드 작성 · 발령 · 결과 검수</text>

  <!-- 작업자 / 검수자 -->
  <rect class="ai" x="250" y="470" width="200" height="56" rx="10"/>
  <text class="name" x="350" y="494" text-anchor="middle">작업자</text>
  <text class="note" x="350" y="514" text-anchor="middle">구현</text>
  <rect class="ai" x="550" y="470" width="200" height="56" rx="10"/>
  <text class="name" x="650" y="494" text-anchor="middle">검수자</text>
  <text class="note" x="650" y="514" text-anchor="middle">독립 검증</text>

  <!-- 감시기 -->
  <rect class="watch" x="830" y="130" width="330" height="140" rx="10"/>
  <text class="name" x="995" y="156" text-anchor="middle">감시기 (kadan watch)</text>
  <text class="note" x="995" y="175" text-anchor="middle">화면과 원장을 읽고 이상을 알린다</text>
  <rect class="inner" x="850" y="192" width="135" height="58" rx="8"/>
  <text class="name" x="917" y="216" text-anchor="middle">감시sh</text>
  <text class="note" x="917" y="236" text-anchor="middle">AI 없이 결정식</text>
  <rect class="inner" x="1005" y="192" width="135" height="58" rx="8"/>
  <text class="name" x="1072" y="216" text-anchor="middle">감시AI</text>
  <text class="note" x="1072" y="236" text-anchor="middle">작업·감독 점검</text>

  <!-- 원장 -->
  <rect class="ledger" x="850" y="400" width="260" height="78" rx="10"/>
  <text class="name" x="980" y="428" text-anchor="middle">원장</text>
  <text class="note" x="980" y="448" text-anchor="middle">모든 사건을 뒤에만 덧붙인다</text>
  <text class="note" x="980" y="465" text-anchor="middle">고치거나 지우지 않는다</text>

  <!-- 바닥 / 로티 창 -->
  <rect class="floor" x="40" y="580" width="1120" height="110" rx="12"/>
  <text class="name" x="62" y="610">바닥: tmux</text>
  <text class="note" x="62" y="632">모든 역할은 kadan-&lt;역할&gt; 이름의 세션 하나씩으로 산다.</text>
  <text class="note" x="62" y="651">kadan attach로 사람이 직접 들어가 입력할 수 있다.</text>
  <text class="note" x="62" y="670">시험 바닥 herdr는 명시해서 고를 때만 쓴다.</text>
  <rect class="win" x="560" y="598" width="320" height="76" rx="10"/>
  <text class="name" x="720" y="624" text-anchor="middle">로티 창</text>
  <text class="note" x="720" y="644" text-anchor="middle">tmux 세션을 탭으로 붙여 보여 주는 화면</text>
  <text class="note" x="720" y="661" text-anchor="middle">바닥이 아니라 창이다</text>

  <!-- 사용자 ↔ 비서 -->
  <path class="arrow" d="M300 92 H132 V150" style="marker-start:url(#head)"/>
  <text class="lbl" x="216" y="85" text-anchor="middle">요청 · 확인 결과</text>

  <!-- 비서 → 슈퍼감독 -->
  <path class="arrow" d="M235 188 H268 V218 H300"/>
  <text class="lbl" x="268" y="172" text-anchor="middle">맥락 우편</text>

  <!-- 사용자 ↔ 슈퍼감독 -->
  <path class="arrow" d="M380 120 V190"/>
  <text class="lbl" x="372" y="150" text-anchor="end">결정 답 · 질문</text>
  <path class="arrow" d="M620 190 V120"/>
  <text class="lbl" x="628" y="146" text-anchor="start">결정 요청</text>
  <text class="lbl" x="628" y="163" text-anchor="start">(머지 승인 포함)</text>

  <!-- 슈퍼감독 ↔ 일반감독 -->
  <path class="arrow" d="M380 246 V330"/>
  <text class="lbl" x="372" y="283" text-anchor="end">맥락 우편</text>
  <text class="lbl" x="372" y="300" text-anchor="end">(담당 연결)</text>
  <path class="arrow" d="M620 330 V246"/>
  <text class="lbl" x="628" y="283" text-anchor="start">질문</text>
  <text class="lbl" x="628" y="300" text-anchor="start">(새 감독 필요 요청)</text>

  <!-- 일반감독 ↔ 작업자 / 검수자 -->
  <path class="arrow" d="M320 386 V470"/>
  <text class="lbl" x="312" y="432" text-anchor="end">발령·답</text>
  <path class="arrow" d="M390 470 V386"/>
  <text class="lbl" x="398" y="426" text-anchor="start">완료 보고·질문</text>
  <text class="lbl" x="398" y="443" text-anchor="start">(DONE 마커)</text>
  <path class="arrow" d="M610 386 V470"/>
  <text class="lbl" x="602" y="432" text-anchor="end">발령·답</text>
  <path class="arrow" d="M680 470 V386"/>
  <text class="lbl" x="688" y="426" text-anchor="start">완료 보고·질문</text>
  <text class="lbl" x="688" y="443" text-anchor="start">(DONE 마커)</text>

  <!-- 감시기 경보 -->
  <path class="alert" d="M830 160 H760 Q740 160 740 180 V210 Q740 218 732 218 H700"/>
  <text class="lbl" x="748" y="150" text-anchor="start" style="fill:#b91c1c">경보</text>
  <path class="alert" d="M830 250 H770 Q750 250 750 270 V340 Q750 358 732 358 H700"/>
  <text class="lbl" x="758" y="300" text-anchor="start" style="fill:#b91c1c">경보</text>
  <text class="note" x="758" y="316" style="fill:#b91c1c">(직속 상위로)</text>
  <path class="alert" d="M1100 130 V92 H700"/>
  <text class="lbl" x="905" y="84" text-anchor="middle" style="fill:#b91c1c">최상위 경보 · OS 알림</text>

  <!-- 감시기 → 바닥 읽기 -->
  <path class="read" d="M1140 270 V580"/>
  <text class="lbl" x="1132" y="540" text-anchor="end" style="fill:#b91c1c">화면 읽기</text>

  <!-- 원장 기록 -->
  <path class="rec" d="M700 372 H790 V440 H850"/>
  <text class="lbl" x="780" y="394" text-anchor="end" style="fill:#15803d">사건 기록</text>
  <path class="rec" d="M980 270 V400"/>
  <text class="lbl" x="988" y="340" text-anchor="start" style="fill:#15803d">경보를 기록</text>
</svg>
