name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.shard != '' && format(' {0}', matrix.shard) || '' }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 우분투·맥 모두 시험 파일을 두 조각으로 나눠 동시에 돈다(tests/run.mjs --shard).
        include:
          - {os: ubuntu-latest, shard: '1/2'}
          - {os: ubuntu-latest, shard: '2/2'}
          - {os: macos-latest, shard: '1/2'}
          - {os: macos-latest, shard: '2/2'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install tmux (ubuntu)
        if: runner.os == 'Linux'
        run: |
          command -v tmux >/dev/null || (sudo apt-get update && sudo apt-get install -y tmux)
          tmux -V
      - name: install tmux (macos)
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: npm --prefix gui ci
      - run: npm run test:gui
      - run: npm run build:gui
      - name: npm test
        # 조각 값이 비면 인자 없이 전체를 돈다. 값은 위 matrix의 고정 문자열이다.
        run: npm test -- ${SHARD:+--shard=$SHARD}
        env:
          KADAN_HOME: ${{ runner.temp }}/kadan-home
          SHARD: ${{ matrix.shard }}
  public-strings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-public-strings.mjs --staged
      - name: Check every introduced commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-public-strings.mjs --range "$BASE_SHA" HEAD
  ci:
    if: always()
    needs: [test, public-strings]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PUBLIC_RESULT: ${{ needs.public-strings.result }}
        run: test "$TEST_RESULT" = success && test "$PUBLIC_RESULT" = success
